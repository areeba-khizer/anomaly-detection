<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Anomaly Detection</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0e1117; --panel: #161b22; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --danger: #f85149;
      --ok: #3fb950;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      Roboto, Helvetica, Arial, sans-serif; background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 20px 28px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px;
    }
    h1 { font-size: 20px; margin: 0; }
    h1 span { color: var(--accent); }
    .controls { display: flex; gap: 10px; align-items: center; }
    button {
      background: var(--accent); color: #0d1117; border: none;
      padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer;
    }
    button.secondary { background: var(--panel); color: var(--text);
      border: 1px solid var(--border); }
    button:hover { opacity: 0.9; }
    main { padding: 24px 28px; max-width: 1200px; margin: 0 auto; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
      margin-bottom: 24px; }
    .card { background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px 18px; }
    .card .label { color: var(--muted); font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.5px; }
    .card .value { font-size: 28px; font-weight: 700; margin-top: 6px; }
    .danger { color: var(--danger); } .ok { color: var(--ok); }
    .chart-wrap { background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 18px; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px;
      border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    .badge { padding: 2px 10px; border-radius: 20px; font-size: 12px;
      font-weight: 600; }
    .badge.anom { background: rgba(248,81,73,0.15); color: var(--danger); }
    .badge.norm { background: rgba(63,185,80,0.15); color: var(--ok); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--ok); margin-right: 8px; }
    .dot.off { background: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>📉 Real-Time <span>Anomaly Detection</span></h1>
    <div class="controls">
      <span><span class="dot off" id="statusDot"></span>
        <span id="statusText">paused</span></span>
      <button id="toggleBtn">Start stream</button>
      <button class="secondary" id="resetBtn">Reset</button>
    </div>
  </header>

  <main>
    <div class="cards">
      <div class="card"><div class="label">Points seen</div>
        <div class="value" id="cPoints">0</div></div>
      <div class="card"><div class="label">Anomalies flagged</div>
        <div class="value danger" id="cAnoms">0</div></div>
      <div class="card"><div class="label">Latest score</div>
        <div class="value" id="cScore">—</div></div>
      <div class="card"><div class="label">Threshold</div>
        <div class="value" id="cThresh">—</div></div>
    </div>

    <div class="chart-wrap"><canvas id="valueChart" height="90"></canvas></div>
    <div class="chart-wrap"><canvas id="scoreChart" height="70"></canvas></div>

    <div class="chart-wrap">
      <h3 style="margin-top:0">Recent flagged anomalies</h3>
      <table>
        <thead><tr><th>Step</th><th>Value</th><th>Score</th>
          <th>Status</th></tr></thead>
        <tbody id="anomTable"></tbody>
      </table>
    </div>
  </main>

  <script>
    const MAX = 120;
    let running = false, timer = null, anomalyCount = 0;

    const valueChart = new Chart(document.getElementById("valueChart"), {
      type: "line",
      data: { labels: [], datasets: [
        { label: "Value", data: [], borderColor: "#58a6ff",
          backgroundColor: "rgba(88,166,255,0.1)", borderWidth: 2,
          pointRadius: 0, tension: 0.25, fill: true },
        { label: "Anomalies", data: [], borderColor: "#f85149",
          backgroundColor: "#f85149", showLine: false, pointRadius: 5,
          pointStyle: "rectRot" },
      ]},
      options: { animation: false, responsive: true,
        scales: { x: { ticks: { color: "#8b949e", maxTicksLimit: 8 },
          grid: { color: "#21262d" } },
          y: { ticks: { color: "#8b949e" }, grid: { color: "#21262d" } } },
        plugins: { legend: { labels: { color: "#e6edf3" } },
          title: { display: true, text: "Live signal", color: "#e6edf3" } } }
    });

    const scoreChart = new Chart(document.getElementById("scoreChart"), {
      type: "line",
      data: { labels: [], datasets: [
        { label: "Anomaly score", data: [], borderColor: "#d29922",
          backgroundColor: "rgba(210,153,34,0.1)", borderWidth: 2,
          pointRadius: 0, tension: 0.25, fill: true },
        { label: "Threshold", data: [], borderColor: "#f85149",
          borderDash: [6, 4], borderWidth: 1.5, pointRadius: 0 },
      ]},
      options: { animation: false, responsive: true,
        scales: { x: { ticks: { color: "#8b949e", maxTicksLimit: 8 },
          grid: { color: "#21262d" } },
          y: { min: 0, max: 1, ticks: { color: "#8b949e" },
            grid: { color: "#21262d" } } },
        plugins: { legend: { labels: { color: "#e6edf3" } },
          title: { display: true, text: "Anomaly score",
            color: "#e6edf3" } } }
    });

    function pushChart(p) {
      const vc = valueChart.data, sc = scoreChart.data;
      vc.labels.push(p.step);
      vc.datasets[0].data.push(p.value);
      vc.datasets[1].data.push(p.is_anomaly ? p.value : null);
      sc.labels.push(p.step);
      sc.datasets[0].data.push(p.anomaly_score);
      sc.datasets[1].data.push(p.threshold);
      [vc.datasets[0], vc.datasets[1], sc.datasets[0], sc.datasets[1]]
        .forEach(d => { while (d.data.length > MAX) d.data.shift(); });
      while (vc.labels.length > MAX) vc.labels.shift();
      while (sc.labels.length > MAX) sc.labels.shift();
      valueChart.update(); scoreChart.update();
    }

    function updateCards(p) {
      document.getElementById("cPoints").textContent = p.step + 1;
      document.getElementById("cAnoms").textContent = anomalyCount;
      document.getElementById("cScore").textContent =
        p.anomaly_score.toFixed(3);
      document.getElementById("cScore").className =
        "value " + (p.is_anomaly ? "danger" : "ok");
      document.getElementById("cThresh").textContent =
        p.threshold.toFixed(2);
    }

    function addAnomalyRow(p) {
      const tbody = document.getElementById("anomTable");
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${p.step}</td><td>${p.value.toFixed(2)}</td>
        <td>${p.anomaly_score.toFixed(3)}</td>
        <td><span class="badge anom">ANOMALY</span></td>`;
      tbody.prepend(tr);
      while (tbody.children.length > 12) tbody.removeChild(tbody.lastChild);
    }

    async function tick() {
      try {
        const res = await fetch("/stream/next");
        const p = await res.json();
        if (p.is_anomaly) { anomalyCount++; addAnomalyRow(p); }
        pushChart(p); updateCards(p);
      } catch (e) { console.error(e); }
    }

    function setRunning(v) {
      running = v;
      document.getElementById("statusDot").className =
        "dot" + (v ? "" : " off");
      document.getElementById("statusText").textContent =
        v ? "streaming" : "paused";
      document.getElementById("toggleBtn").textContent =
        v ? "Pause stream" : "Start stream";
      if (v) timer = setInterval(tick, 500);
      else clearInterval(timer);
    }

    async function loadHistory() {
      // Render any points already scored by the server (survives refreshes).
      try {
        const res = await fetch("/history");
        const { points } = await res.json();
        for (const p of points) {
          if (p.is_anomaly) { anomalyCount++; addAnomalyRow(p); }
          pushChart(p);
        }
        if (points.length) updateCards(points[points.length - 1]);
      } catch (e) { console.error(e); }
    }

    document.getElementById("toggleBtn").onclick = () => setRunning(!running);
    document.getElementById("resetBtn").onclick = async () => {
      await fetch("/reset", { method: "POST" });
      anomalyCount = 0;
      [valueChart, scoreChart].forEach(c => {
        c.data.labels = [];
        c.data.datasets.forEach(d => d.data = []);
        c.update();
      });
      document.getElementById("anomTable").innerHTML = "";
      document.getElementById("cPoints").textContent = "0";
      document.getElementById("cAnoms").textContent = "0";
      document.getElementById("cScore").textContent = "—";
    };

    loadHistory();
  </script>
</body>
</html>
